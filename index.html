<script>
/* ===== Pengelola Keuangan: inti ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('id-ID');
const rp=n=>(n<0?'-':'')+'Rp '+fmt(Math.abs(n));
const short=n=>{const a=Math.abs(n);return (n<0?'-':'')+(a>=1e9?(a/1e9).toFixed(1).replace(/\.0$/,'')+'M':a>=1e6?(a/1e6).toFixed(1).replace(/\.0$/,'')+'jt':a>=1e3?Math.round(a/1e3)+'rb':String(Math.round(a)))};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dt=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const days=(a,b)=>Math.round((dt(b)-dt(a))/864e5)+1;
const TODAY=()=>iso(new Date());
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HRS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const HRF=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const fd=d=>{if(!d)return '-';const x=dt(d);return x.getDate()+' '+BLS[x.getMonth()]+' '+x.getFullYear()};
const fdm=d=>{const x=dt(d);return x.getDate()+' '+BLS[x.getMonth()]};
const PAL=['#F6C9D2','#BCD3EF','#CFE3B0','#F7E3A1','#E3D3F0','#F9D2B5','#BFE6DC','#E8C7E3','#D9D2B8','#B9C8E8'];

/* ---------- state ---------- */
let D=null,_E=null;
const N0=new Date();
const S={tab:'trans',sub:'harian',y:N0.getFullYear(),m:N0.getMonth(),sel:'',wk:'',st:{p:'m',t:'out',v:'stat'},ad:'',ro:0,mo:'',off:0,inited:0,hid:0,as:'akun'};
const KAT={in:{},out:{}};
const isLiab=a=>LIAB.includes(a.grup);
const acct=n=>(D&&D.akun.find(a=>a.nama==n))||null;
const acol=n=>{const i=D?D.akun.findIndex(a=>a.nama==n):-1;const a=i>-1?D.akun[i]:null;return a?(a.warna||PAL[i%PAL.length]):'#D9D2B8'};
const adot=n=>`<i class="adot" style="background:${acol(n)}"></i>`;
const kikon=(ty,n)=>((KAT[ty]||{})[n]||{}).ikon||'📁';

function prep(){
 const so=(a,b)=>(+a.urut||9999)-(+b.urut||9999);
 D.akun.sort(so);D.kat.sort(so);
 KAT.in={};KAT.out={};
 D.kat.forEach(k=>{if(KAT[k.type])KAT[k.type][k.nama]={id:k.id,ikon:k.ikon||'📁',subs:k.subs?String(k.subs).split('|').filter(Boolean):[]}});
 _E=null;
}
function setD(d){
 D=d;
 ['tx','trf','akun','kat','ang','rep','bm','memo','goal','hut'].forEach(k=>D[k]=D[k]||[]);
 D.set=Object.assign({startDay:1,startScreen:'harian',subOn:true},D.set||{});
 prep();
 if(!S.inited){S.inited=1;const c=curMonth();S.y=c[0];S.m=c[1];S.sub=D.set.startScreen=='kalender'?'kalender':'harian'}
}
function entries(){
 if(_E)return _E;
 const byNew=(a,b)=>b.date.localeCompare(a.date);
 _E=[...D.tx.map(t=>({id:t.id,type:t.type,date:t.date,akun:t.akun,ke:'',nilai:+t.nilai,kat:t.kat,sub:t.sub||'',cat:t.cat||'',tag:t.tag||''})),
     ...D.trf.map(t=>({id:t.id,type:'trf',date:t.tanggal,akun:t.dari,ke:t.ke,nilai:+t.nilai,kat:'Transfer',sub:'',cat:t.catatan||'',tag:''}))].sort(byNew);
 return _E;
}

/* ---------- periode (mendukung tanggal mulai bulan) ---------- */
const SD=()=>Math.min(28,Math.max(1,+(D&&D.set.startDay)||1));
function mrange(y,m){const sd=SD();return sd==1?[iso(new Date(y,m,1)),iso(new Date(y,m+1,0))]:[iso(new Date(y,m,sd)),iso(new Date(y,m+1,sd-1))]}
const yrange=y=>[mrange(y,0)[0],mrange(y,11)[1]];
function curMonth(){const n=new Date();let y=n.getFullYear(),m=n.getMonth();if(n.getDate()<SD()){m--;if(m<0){m=11;y--}}return [y,m]}
const inR=(e,r)=>e.date>=r[0]&&e.date<=r[1];
const inc=l=>sum(l.filter(e=>e.type=='in'),e=>e.nilai);
const exp=l=>sum(l.filter(e=>e.type=='out'),e=>e.nilai);
function weekOf(d){const x=dt(d),w=(x.getDay()+6)%7;return addD(d,-w)}

/* ---------- saldo ---------- */
function bal(){
 const A={};
 D.akun.forEach(a=>A[a.nama]=+a.saldo||0);
 D.tx.forEach(t=>{A[t.akun]=(A[t.akun]||0)+(t.type=='in'?1:-1)*t.nilai});
 D.trf.forEach(t=>{A[t.dari]=(A[t.dari]||0)-(+t.nilai);A[t.ke]=(A[t.ke]||0)+(+t.nilai)});
 D.akun.forEach(a=>{if(a.grup=='Kartu Debit'&&a.link&&A[a.link]!==undefined)A[a.nama]=A[a.link]});
 Object.keys(A).forEach(k=>A[k]=Math.round(A[k]*100)/100);
 return A;
}
function totals(A){let as=0,li=0;D.akun.forEach(a=>{if(a.grup=='Kartu Debit')return;const v=A[a.nama]||0;if(isLiab(a))li+=v;else as+=v});return {as,li:-li,tot:as+li}}
function balAt(end){
 const A={};D.akun.forEach(a=>A[a.nama]=+a.saldo||0);
 D.tx.forEach(t=>{if(t.date<=end)A[t.akun]=(A[t.akun]||0)+(t.type=='in'?1:-1)*t.nilai});
 D.trf.forEach(t=>{if(t.tanggal<=end){A[t.dari]=(A[t.dari]||0)-(+t.nilai);A[t.ke]=(A[t.ke]||0)+(+t.nilai)}});
 let tot=0;D.akun.forEach(a=>{if(a.grup!='Kartu Debit')tot+=A[a.nama]||0});
 return tot;
}

/* ---------- jaringan & antrean offline ---------- */
async function call(fn,...args){
 const c=cfg();if(!c)throw new Error('Belum tersambung');
 let r;
 try{r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:c.key,fn,args})})}catch(e){const x=new Error('Tidak ada koneksi internet');x.net=1;throw x}
 let j;try{j=await r.json()}catch(e){throw new Error('Jawaban server tidak dikenali. Periksa alamat sambungan dan pengaturan deployment.')}
 if(!j.ok)throw new Error(j.error);
 return j.data;
}
const TK={Akun:'akun',Transfer:'trf',Kategori:'kat',Anggaran:'ang',Berulang:'rep',Bookmark:'bm',Catatan:'memo',Tabungan:'goal',Hutang:'hut'};
function renameKat(ty,from,to,renames){
 D.tx.forEach(t=>{if(t.type==ty&&t.kat==from){t.kat=to}});
 (renames||[]).forEach(r=>{D.tx.forEach(t=>{if(t.type==ty&&t.kat==to&&t.sub==r.o)t.sub=r.n})});
 if(from!=to){D.rep.forEach(x=>{if(x.type==ty&&x.kat==from)x.kat=to});D.bm.forEach(x=>{if(x.type==ty&&x.kat==from)x.kat=to});if(ty=='out')D.ang.forEach(x=>{if(x.kat==from)x.kat=to})}
}
function reduce(fn,a){
 if(fn=='saveTx'){const o=a[0],r={id:o.id,type:o.type,date:o.date,akun:o.akun,kat:o.kat,sub:o.sub||'',nilai:+o.nilai,cat:o.cat||'',tag:o.tag||''},i=D.tx.findIndex(x=>x.id==o.id);if(i>-1)D.tx[i]=r;else D.tx.push(r)}
 else if(fn=='delTx')D.tx=D.tx.filter(x=>x.id!=a[0]);
 else if(fn=='upsert'){const n=a[0],o=a[1],k=TK[n],i=D[k].findIndex(x=>x.id==o.id);if(i>-1)Object.assign(D[k][i],o);else D[k].push({...o});if(n=='Akun')prep()}
 else if(fn=='remove'){const k=TK[a[0]];D[k]=D[k].filter(x=>x.id!=a[1]);prep()}
 else if(fn=='saveAkun'){
  const o=a[0],i=D.akun.findIndex(x=>x.id==o.id),old=i>-1?D.akun[i].nama:null;
  if(i>-1)Object.assign(D.akun[i],o);else D.akun.push({sembunyi:0,saldo:0,urut:999,...o});
  if(old&&o.nama&&o.nama!=old){D.tx.forEach(t=>{if(t.akun==old)t.akun=o.nama});D.trf.forEach(t=>{if(t.dari==old)t.dari=o.nama;if(t.ke==old)t.ke=o.nama});D.rep.forEach(t=>{if(t.akun==old)t.akun=o.nama;if(t.ke==old)t.ke=o.nama});D.bm.forEach(t=>{if(t.akun==old)t.akun=o.nama;if(t.ke==old)t.ke=o.nama});D.akun.forEach(t=>{if(t.link==old)t.link=o.nama})}
  prep();
 }
 else if(fn=='saveKategori'){
  const o=a[0],i=D.kat.findIndex(x=>x.id==o.id),sub=(o.subs||[]).join('|'),old=i>-1?D.kat[i]:null;
  if(old){renameKat(o.type,old.nama,o.nama,o.renames);Object.assign(old,{nama:o.nama,subs:sub,ikon:o.ikon||old.ikon})}
  else D.kat.push({id:o.id,type:o.type,nama:o.nama,subs:sub,ikon:o.ikon||'📁',urut:999});
  prep();
 }
 else if(fn=='saveSettings'){Object.assign(D.set,a[0]);prep()}
 else if(fn=='reorder'){a[1].forEach((id,n)=>{const x=D.akun.find(y=>y.id==id);if(x)x.urut=n+1});prep()}
 _E=null;
}
function op(fn,args){
 reduce(fn,args);
 const q=getQ();q.push({fn,args});ls.set('q',q);
 ls.set('cache',D);
 render();flush();
}
let flushing=false;
async function flush(){
 if(flushing||!cfg())return;
 flushing=true;
 try{
  for(let guard=0;guard<50;guard++){
   let net=false;
   while(getQ().length){
    const it=getQ()[0];
    try{await call(it.fn,...it.args);ls.set('q',getQ().slice(1))}
    catch(e){if(e.net){net=true;break}ls.set('q',getQ().slice(1));toast(e.message,0)}
   }
   S.off=net?1:0;updPill();
   if(net)break;
   try{const d=await call('load');if(getQ().length)continue;ls.set('cache',d);setD(d);render()}
   catch(e){if(e.net){S.off=1;updPill()}else toast(e.message,0)}
   if(!getQ().length)break;
  }
 }finally{flushing=false;updPill()}
}
function updPill(){const p=$('#sync');if(!p)return;const n=getQ().length;p.textContent=n?'⏳ '+n:S.off?'Offline':'';p.style.display=n||S.off?'inline-flex':'none'}

const bar=(title,right='')=>`<header class="top"><div class="ttl"><img src="peanut.png" class="mas" alt=""><h1>${title}</h1></div><div class="tr">${right}<span id="sync" class="pill" onclick="flush()"></span></div></header>`;

/* ---------- navigasi periode ---------- */
function weekLbl(){return fdm(S.sw)+' – '+fdm(addD(S.sw,6))+' '+dt(addD(S.sw,6)).getFullYear()}
function mnavHtml(yr,wk){
 const c=curMonth(),now=wk?S.sw==weekOf(TODAY()):yr?S.y==c[0]:(S.y==c[0]&&S.m==c[1]);
 const r=mrange(S.y,S.m),lbl=wk?weekLbl():yr?S.y:BLN[S.m]+' '+S.y,sub=(!yr&&!wk&&SD()>1)?`<small>${fdm(r[0])} – ${fdm(r[1])}</small>`:'';
 return `<div class="mnav"><button type="button" class="ico" onclick="nav(-1)" aria-label="Sebelumnya">‹</button><div class="mwhen"><b>${lbl}</b>${sub}${now?'':'<button type="button" class="lk" onclick="toNow()">Kembali ke sekarang</button>'}</div><button type="button" class="ico" onclick="nav(1)" aria-label="Berikutnya">›</button></div>`;
}
function nav(d){
 if(S.tab=='stats'&&S.st.p=='w'){S.sw=addD(S.sw,7*d)}
 else{const yr=(S.tab=='trans'&&S.sub=='bulanan')||(S.tab=='stats'&&S.st.p=='y');if(yr)S.y+=d;else{const x=new Date(S.y,S.m+d,1);S.y=x.getFullYear();S.m=x.getMonth()}}
 S.sel='';S.wk='';render();
}
function toNow(){const c=curMonth();S.y=c[0];S.m=c[1];S.sw=weekOf(TODAY());S.sel='';S.wk='';render()}

/* ---------- daftar transaksi ---------- */
function entRow(e,ctx){
 const tr=e.type=='trf',out=tr?(ctx?e.akun==ctx:false):e.type=='out',tone=tr?(ctx?(out?'out':'in'):'trf'):e.type,sg=tr&&!ctx?'':(out?'−':'+');
 const ic=tr?'⇄':kikon(e.type,e.kat),title=tr?'Transfer':esc(e.kat)+(e.sub&&D.set.subOn?` <small>${esc(e.sub)}</small>`:'');
 const who=tr?`${adot(e.akun)}${esc(e.akun)} → ${esc(e.ke)}`:`${adot(e.akun)}${esc(e.akun)}`;
 return `<li class="ent" onclick="editEnt('${e.id}')"><span class="eic ${e.type}">${ic}</span><div class="ewhat"><b>${title}</b><span>${e.cat?esc(e.cat)+' · ':''}${who}${e.tag?' · #'+esc(e.tag):''}</span></div><span class="eamt ${tone}">${sg}${rp(e.nilai)}</span></li>`;
}
function dayGroups(L,ctx){
 if(!L.length)return empty('Belum ada transaksi','Ketuk + untuk mencatat yang pertama.');
 const g={};L.forEach(e=>(g[e.date]=g[e.date]||[]).push(e));
 const isIn=e=>e.type=='in'||(ctx&&e.type=='trf'&&e.ke==ctx),isOut=e=>e.type=='out'||(ctx&&e.type=='trf'&&e.akun==ctx);
 return Object.keys(g).sort().reverse().map(d=>{
  const A=g[d],i=sum(A.filter(isIn),e=>e.nilai),o=sum(A.filter(isOut),e=>e.nilai),x=dt(d);
  return `<section class="dg"><div class="dh"><span class="dn">${x.getDate()}</span><span class="dw ${x.getDay()==0?'sun':''}">${HRS[x.getDay()]}</span><span class="dm">${BLS[x.getMonth()]} ${x.getFullYear()}</span><span class="dt"><b class="in">${i?rp(i):''}</b><b class="out">${o?rp(o):''}</b></span></div><ul class="ents">${A.map(e=>entRow(e,ctx)).join('')}</ul></section>`;
 }).join('');
}

/* ---------- tab Transaksi ---------- */
const TSUBS=[['harian','Harian'],['kalender','Kalender'],['mingguan','Mingguan'],['bulanan','Bulanan'],['ringkasan','Ringkasan'],['catatan','Catatan']];
function trans(){
 const yr=S.sub=='bulanan',r=yr?yrange(S.y):mrange(S.y,S.m),L=entries().filter(e=>inR(e,r)),I=inc(L),O=exp(L);
 const body={harian:()=>dayGroups(L),kalender:()=>calHtml(L,r),mingguan:()=>weekHtml(L,r),bulanan:monthsHtml,ringkasan:()=>sumHtml(L,r),catatan:()=>memoHtml(r)}[S.sub]();
 return bar('Transaksi','<button type="button" class="ico" onclick="searchForm()" aria-label="Cari">🔍</button><button type="button" class="ico" onclick="bmList()" aria-label="Favorit">★</button>')+
 mnavHtml(yr)+
 `<div class="sum"><div><span>Pemasukan</span><b class="in">${rp(I)}</b></div><div><span>Pengeluaran</span><b class="out">${rp(O)}</b></div><div><span>Total</span><b>${rp(I-O)}</b></div></div>`+
 `<div class="tabs" role="tablist">${TSUBS.map(([k,l])=>`<button type="button" role="tab" aria-selected="${S.sub==k}" onclick="S.sub='${k}';S.wk='';render()">${l}</button>`).join('')}</div><div class="body">${body}</div>`;
}
function calHtml(L,r){
 const [a,b]=r,t=TODAY();
 if(!S.sel||S.sel<a||S.sel>b)S.sel=(t>=a&&t<=b)?t:a;
 const by={};L.forEach(e=>{const o=by[e.date]=by[e.date]||{i:0,o:0};if(e.type=='in')o.i+=e.nilai;else if(e.type=='out')o.o+=e.nilai});
 const lead=(dt(a).getDay()+6)%7,n=days(a,b);
 let h=['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map((d,i)=>`<div class="wd ${i==6?'sun':''}">${d}</div>`).join('')+'<div class="cell pad"></div>'.repeat(lead);
 for(let i=0;i<n;i++){const d=addD(a,i),x=by[d]||{i:0,o:0};h+=`<button type="button" class="cell ${d==S.sel?'sel':''} ${d==t?'today':''}" onclick="S.sel='${d}';render()"><i>${dt(d).getDate()}</i><b class="in">${x.i?short(x.i):''}</b><b class="out">${x.o?short(x.o):''}</b></button>`}
 const dl=L.filter(e=>e.date==S.sel);
 return `<div class="card"><div class="cal">${h}</div></div><div class="card"><div class="rowl"><b>${HRF[dt(S.sel).getDay()]}, ${fd(S.sel)}</b><button type="button" class="btn sm" onclick="openForm('out',null,'${S.sel}')">+ Tambah</button></div>${dl.length?`<ul class="ents">${dl.map(e=>entRow(e)).join('')}</ul>`:'<div class="mut pad">Belum ada transaksi di tanggal ini.</div>'}</div>`;
}
function weekHtml(L,r){
 const [a,b]=r,ws=[];let s=a;
 while(s<=b){const e=addD(weekOf(s),6),we=e<b?e:b;ws.push([s,we]);s=addD(we,1)}
 return ws.slice().reverse().map(([x,y])=>{
  const WL=L.filter(e=>e.date>=x&&e.date<=y),open=S.wk==x;
  return `<div class="card"><button type="button" class="rowl tapr" onclick="S.wk='${open?'':x}';render()"><div><b>${fdm(x)} – ${fdm(y)}</b></div><div class="tri"><b class="in">${rp(inc(WL))}</b><b class="out">${rp(exp(WL))}</b><b>${rp(inc(WL)-exp(WL))}</b></div></button>${open?dayGroups(WL):''}</div>`;
 }).join('');
}
function monthsHtml(){
 const c=curMonth();
 return Array.from({length:12},(_,m)=>11-m).map(m=>{
  const r=mrange(S.y,m),L=entries().filter(e=>inR(e,r)),I=inc(L),O=exp(L);
  return `<button type="button" class="card rowl tapr ${S.y==c[0]&&m==c[1]?'cur':''}" onclick="S.m=${m};S.sub='kalender';S.sel='';render()"><div><b>${BLN[m]}</b><small>${fdm(r[0])} – ${fdm(r[1])}</small></div><div class="tri"><b class="in">${rp(I)}</b><b class="out">${rp(O)}</b><b>${rp(I-O)}</b></div></button>`;
 }).join('');
}
function sumHtml(L,r){
 const O=exp(L),I=inc(L),tb=budOf('*',''),n=Math.max(1,Math.min(days(r[0],r[1]),Math.max(1,days(r[0],TODAY()>r[1]?r[1]:TODAY()))));
 const by=ty=>{const m={};L.filter(e=>e.type==ty).forEach(e=>m[e.akun]=(m[e.akun]||0)+e.nilai);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
 const lst=(a,c)=>a.length?`<ul class="ents">${a.map(([k,v])=>`<li class="rowl pad"><span>${adot(k)}${esc(k)}</span><b class="${c}">${rp(v)}</b></li>`).join('')}</ul>`:'<div class="mut pad">Tidak ada data.</div>';

/* ===== Form & pemilih ===== */
const OPS='÷×−+';
function evalExpr(e){
 if(!e)return 0;
 e=e.replace(/[÷×−+]$/,'');
 const t=e.match(/\d+(?:\.\d*)?|[÷×−+]/g);if(!t)return 0;
 const terms=[parseFloat(t[0])],ops=[];
 if(isNaN(terms[0]))return null;
 for(let i=1;i<t.length;i+=2){
  const o=t[i],n=parseFloat(t[i+1]);if(isNaN(n))return null;
  if(o=='×')terms[terms.length-1]*=n;
  else if(o=='÷'){if(n==0)return null;terms[terms.length-1]/=n}
  else{ops.push(o);terms.push(n)}
 }
 let r=terms[0];ops.forEach((o,k)=>{r+=o=='+'?terms[k+1]:-terms[k+1]});
 return Math.round(r*100)/100;
}
const numStr=v=>v==null?'Error':Number.isInteger(v)?fmt(v):v.toLocaleString('id-ID',{maximumFractionDigits:2});
function parseNum(s){const v=evalExpr(String(s||'').replace(/\./g,'').replace(',','.'));return v==null?0:v}

const ZB=k=>`<div class="chips">${['00','000'].map(z=>`<button type="button" class="chip" onclick="addZ('${k}','${z}',this)">+${z}</button>`).join('')}</div>`;
const mon=(k,l)=>F(l,`<div class="amtbox"><span>Rp</span><input inputmode="numeric" placeholder="0" value="${S.f[k]?fmt(S.f[k]):''}" oninput="nv(this,'${k}')"></div>${ZB(k)}`);
const inp=(k,l,ph='',ex='')=>F(l,`<input value="${esc(S.f[k])}" placeholder="${ph}" ${ex} oninput="S.f['${k}']=this.value">`);
const dat=(k,l)=>F(l,`<input type="date" value="${S.f[k]||''}" onchange="S.f['${k}']=this.value">`);

function fDay(n){S.f.date=addD(S.f.date||TODAY(),n);sh()}
const KEYS=['7','8','9','⌫','4','5','6','÷','1','2','3','×','0','00','000','−','.','+','=','C'];
const keypad=()=>`<div class="keypad">${KEYS.map(k=>`<button type="button" class="${OPS.includes(k)?'op':k=='='?'eq':k=='C'||k=='⌫'?'clr':''}" onclick="kk('${k}')">${k}</button>`).join('')}</div>`;
function updAmt(){const v=evalExpr(S.f.expr),a=$('#av'),x=$('#ax');if(a)a.textContent=numStr(v);if(x)x.textContent=OPS.split('').some(o=>S.f.expr.includes(o))?S.f.expr:''}
function kk(k){
 let e=S.f.expr||'';
 const seg=e.split(/[÷×−+]/).pop();
 if(k=='⌫')e=e.slice(0,-1);
 else if(k=='C')e='';
 else if(k=='='){const v=evalExpr(e);if(v!=null)e=v?String(v):''}
 else if(OPS.includes(k)){if(!e)return;if(OPS.includes(e.slice(-1)))e=e.slice(0,-1);e+=k}
 else if(k=='.'){if(seg.includes('.'))return;e+=seg?'.':'0.'}
 else{
  if((k=='00'||k=='000')&&!seg)return;
  if(seg=='0'&&/[1-9]/.test(k))e=e.slice(0,-1);
  if(seg=='0'&&(k=='0'||k=='00'||k=='000'))return;
  e+=k;
 }
 S.f.expr=e;updAmt();
}

function fsave(cont){
 const f=S.f,v=evalExpr(f.expr),tr=f.type=='trf';
 if(!(v>0))return toast('Jumlah wajib diisi dan harus lebih dari 0',0);
 if(!f.date)return toast('Tanggal wajib diisi',0);
 if(tr){if(!f.akun||!f.ke)return toast('Pilih akun asal dan tujuan',0);if(f.akun==f.ke)return toast('Akun asal dan tujuan tidak boleh sama',0)}
 else{if(!f.kat)return toast('Pilih kategori dulu',0);if(!f.akun)return toast('Pilih akun',0)}
 let akun=f.akun;const a=acct(akun);
 if(!tr&&a&&a.grup=='Kartu Debit'&&a.link)akun=a.link;
 if(f.freq||f.repId){
  op('upsert',['Berulang',{id:f.repId||uid(),type:f.type,akun:f.akun,ke:tr?f.ke:'',kat:tr?'':f.kat,sub:tr?'':f.sub,nilai:v,cat:f.cat,tag:f.tag,freq:f.freq||'m',mulai:f.date,jumlah:+f.jumlah||0,terakhir:f.repLast||''}]);
  toast('Jadwal berulang tersimpan');
  if(f.orig)op(f.orig.type=='trf'?'remove':'delTx',f.orig.type=='trf'?['Transfer',f.orig.id]:[f.orig.id]);
  return closeS();
 }
 const o=f.orig,oldTr=o&&o.type=='trf',id=o&&oldTr==tr?o.id:uid();
 if(o&&oldTr!=tr)op(oldTr?'remove':'delTx',oldTr?['Transfer',o.id]:[o.id]);
 if(tr){
  op('upsert',['Transfer',{id,tanggal:f.date,dari:f.akun,ke:f.ke,nilai:v,catatan:f.cat,goal:f.goal||''}]);
  if(+f.fee>0&&!o)op('saveTx',[{id:uid(),type:'out',date:f.date,akun:f.akun,kat:'Lainnya',sub:'Biaya admin',nilai:+f.fee,cat:'Biaya transfer',tag:''}]);
 }else op('saveTx',[{id,type:f.type,date:f.date,akun,kat:f.kat,sub:f.sub,nilai:v,cat:f.cat,tag:f.tag}]);
 ls.set('lastAkun',f.akun);
 toast(o?'Perubahan tersimpan':'Tersimpan');
 if(cont){S.f={...f,orig:null,expr:'',cat:'',tag:'',fee:0,freq:'',jumlah:'',repId:'',goal:''};sh()}else closeS();
}
async function fdel(){
 const f=S.f;
 if(!await ask(f.repId?'Hapus jadwal berulang?':'Hapus transaksi ini?',f.repId?'Transaksi yang sudah tercatat tetap ada.':'Baris di spreadsheet akan dikosongkan.'))return;
 if(f.repId)op('remove',['Berulang',f.repId]);
 else if(f.orig.type=='trf')op('remove',['Transfer',f.orig.id]);
 else op('delTx',[f.orig.id]);
 closeS();toast('Dihapus');
}

const goalSaved=g=>{const L=D.trf.filter(t=>t.goal==g.id);return sum(L.filter(t=>t.ke==g.akun),t=>+t.nilai)-sum(L.filter(t=>t.dari==g.akun),t=>+t.nilai)};
function goalNeed(g,saved){
 const rest=(+g.target)-saved;
 if(rest<=0)return 'Target tercapai 🎉';
 if(!g.tenggat)return 'Kurang '+rp(rest);
 const dl=days(TODAY(),g.tenggat);
 if(dl<=0)return 'Lewat tenggat · kurang '+rp(rest);
 const bln=Math.max(1,Math.ceil(dl/30));
 return 'Perlu ± '+rp(rest/bln)+' per bulan · '+dl+' hari lagi';
}

  return `<div class="card goal"><button type="button" class="rowl tapr" onclick="goalDetail('${g.id}')"><span class="eic" style="background:${g.warna||PAL[2]}">${esc(g.ikon||'🎯')}</span><div class="ewhat"><b>${esc(g.nama)}</b><span>${adot(g.akun)}${esc(g.akun)}${g.tenggat?' · tenggat '+fd(g.tenggat):''}</span></div><span class="chip good">${Math.round(p)}%</span></button>

 return form(f.id?'Ubah data':'Hutang / piutang',
  seg([[f.jenis=='Hutang',"S.f.jenis='Hutang';sh()",'Hutang saya'],[f.jenis=='Piutang',"S.f.jenis='Piutang';sh()",'Piutang','inc']])+
  inp('pihak',pt?'Yang berutang kepadamu':'Berutang kepada','Nama orang / lembaga')+mon('total','Total pinjaman')+(f.id?mon('sisa','Sisa yang belum dibayar'):'')+
  dat('mulai','Tanggal pinjaman')+dat('tempo','Jatuh tempo (opsional)')+inp('catatan','Catatan','Opsional')+
  (f.id?'':F(pt?'Uang keluar dari akun':'Uang masuk ke akun',`<select onchange="S.f.catat=this.value?1:0;S.f.akun=this.value">${opts([['','Jangan catat ke akun'],...D.akun.filter(a=>!isLiab(a)&&a.grup!='Kartu Debit').map(a=>[a.nama,a.nama])],f.catat?f.akun:'')}</select><div class="mut">${pt?'Dicatat sebagai pengeluaran':'Dicatat sebagai pemasukan'} kategori Pinjaman agar saldo akun sesuai.</div>`))+
  btns('hutSave()',f.id&&'hutDel()'))};
function hutSave(){
 const f=S.f;
 if(!f.pihak.trim())return toast('Nama pihak wajib diisi',0);
 if(!(f.total>0))return toast('Total wajib diisi dan harus lebih dari 0',0);
 const id=f.id||uid(),old=f.id?D.hut.find(x=>x.id==f.id):null,sisa=f.id?Math.min(f.sisa,f.total):f.total;
 op('upsert',['Hutang',{id,jenis:f.jenis,pihak:f.pihak.trim(),total:f.total,sisa,mulai:f.mulai,tempo:f.tempo,catatan:f.catatan,akun:old?old.akun:(f.catat?f.akun:''),riwayat:old?old.riwayat:'[]',lunas:sisa<=0?1:0}]);
 if(!f.id&&f.catat&&f.akun){const pt=f.jenis=='Piutang';op('saveTx',[{id:uid(),type:pt?'out':'in',date:f.mulai||TODAY(),akun:f.akun,kat:'Pinjaman',sub:pt?'Piutang':'Hutang',nilai:f.total,cat:(pt?'Pinjaman ke ':'Pinjaman dari ')+f.pihak.trim(),tag:''}])}
 closeS();toast('Tersimpan');
}
async function hutDel(){if(await ask('Hapus catatan ini?','Transaksi pembayaran yang sudah tercatat tetap ada di spreadsheet.')){op('remove',['Hutang',S.f.id]);closeS();toast('Dihapus')}}
function hutPay(id){
 const h=D.hut.find(x=>x.id==id),pt=h.jenis=='Piutang';
 S.f={id,nilai:+h.sisa,akun:h.akun||(D.akun.find(a=>!isLiab(a)&&a.grup!='Kartu Debit')||{}).nama||'',tgl:TODAY()};
 openS(()=>form((pt?'Terima dari ':'Bayar ke ')+esc(h.pihak),mon('nilai','Nominal')+F(pt?'Masuk ke akun':'Dibayar dari akun',`<select onchange="S.f.akun=this.value">${opts(D.akun.filter(a=>!isLiab(a)&&a.grup!='Kartu Debit').map(a=>[a.nama,a.nama]),S.f.akun)}</select>`)+dat('tgl','Tanggal')+`<div class="mut">Sisa ${rp(+h.sisa)} · dicatat otomatis sebagai ${pt?'pemasukan':'pengeluaran'} kategori Pinjaman.</div>`+btns('hutPaySave()',null,pt?'Terima':'Bayar')));
}
function hutPaySave(){
 const f=S.f,h=D.hut.find(x=>x.id==f.id),pt=h.jenis=='Piutang';
 if(!(f.nilai>0))return toast('Nominal wajib diisi dan harus lebih dari 0',0);
 if(f.nilai>+h.sisa)return toast('Nominal melebihi sisa ('+rp(+h.sisa)+')',0);
 if(!f.akun)return toast('Pilih akun',0);
 const txid=uid(),r=hRiw(h);r.push({id:txid,t:f.tgl,n:f.nilai,a:f.akun});
 const sisa=Math.round((+h.sisa-f.nilai)*100)/100;
 op('saveTx',[{id:txid,type:pt?'in':'out',date:f.tgl,akun:f.akun,kat:'Pinjaman',sub:pt?'Terima piutang':'Bayar hutang',nilai:f.nilai,cat:(pt?'Terima dari ':'Bayar ke ')+h.pihak,tag:''}]);
 op('upsert',['Hutang',{id:h.id,sisa,riwayat:JSON.stringify(r),lunas:sisa<=0?1:0}]);
 closeS();toast(sisa<=0?'Lunas 🎉':'Pembayaran tercatat');
}
function hutDetail(id){
 const h=D.hut.find(x=>x.id==id);if(!h)return;
 openS(()=>{
  const pt=h.jenis=='Piutang',T=+h.total,s=+h.sisa,p=Math.max(0,Math.min(100,(T-s)/T*100)),R=hRiw(h).slice().reverse();
  return SHEAD(esc(h.pihak))+`<div class="sbody"><div class="card"><div class="rowl"><span class="chip ${pt?'good':'bad'}">${pt?'Piutang':'Hutang'}</span><b class="big ${pt?'in':'out'}">${+h.lunas?'Lunas ✓':rp(s)}</b></div><div class="track"><i style="width:${p}%;background:${pt?'#9DB8E0':'#F0A9B8'}"></i></div><div class="mut">Total ${rp(T)} · terbayar ${rp(T-s)}</div><div class="mut">${h.mulai?'Sejak '+fd(h.mulai):''}${h.tempo?' · jatuh tempo '+fd(h.tempo):''}${h.catatan?' · '+esc(h.catatan):''}</div>
  <div class="row g6">${+h.lunas?'':`<button type="button" class="btn sm" onclick="closeS();hutPay('${h.id}')">${pt?'Terima':'Bayar'}</button>`}<button type="button" class="btn g sm" onclick="closeS();hutForm('${h.id}')">Ubah</button></div></div>
  <div class="card"><h3>Riwayat pembayaran</h3>${R.length?`<ul class="ents">${R.map(x=>`<li class="ent" onclick="hutPayDel('${h.id}','${x.id}')"><div class="ewhat"><b>${fd(x.t)}</b><span>${esc(x.a||'')}</span></div><span class="eamt ${pt?'in':'out'}">${rp(+x.n)}</span></li>`).join('')}</ul><div class="mut pad">Ketuk pembayaran untuk membatalkannya.</div>`:'<div class="mut pad">Belum ada pembayaran.</div>'}</div></div>`;
 });
}
async function hutPayDel(hid,pid){
 const h=D.hut.find(x=>x.id==hid),r=hRiw(h),x=r.find(y=>y.id==pid);if(!x)return;
 if(!await ask('Batalkan pembayaran ini?','Transaksi pembayaran dihapus dan sisa '+(h.jenis=='Piutang'?'piutang':'hutang')+' bertambah '+rp(+x.n)+'.','Batalkan'))return;
 op('delTx',[pid]);
 op('upsert',['Hutang',{id:hid,sisa:Math.round((+h.sisa+(+x.n))*100)/100,riwayat:JSON.stringify(r.filter(y=>y.id!=pid)),lunas:0}]);
 closeS();toast('Pembayaran dibatalkan');
}

/* ===== PIN ===== */
const pinOn=()=>!!ls.get('pin',null);
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mm:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function showLock(){if(!pinOn())return;S.pin='';$('#lock').hidden=false;lockR()}
function lockR(){$('#lock').innerHTML=`<img src="peanut.png" alt=""><b>Masukkan PIN</b><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<S.pin.length?'f':''}"></i>`).join('')}</div><div class="pad4">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button type="button" onclick="pkey('${k}')">${k}</button>`).join('')}</div>`}
async function pkey(k){
 if(k=='⌫')S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=k;
 lockR();
 if(S.pin.length==4){if(await sha(S.pin)==ls.get('pin')){$('#lock').hidden=true;S.pin=''}else{S.pin='';toast('PIN salah',0);lockR()}}
}
function pinForm(){
 S.f={a:'',b:''};
 openS(()=>form(pinOn()?'Ubah PIN':'Atur PIN',F('PIN baru (4 angka)',`<input type="password" inputmode="numeric" maxlength="4" oninput="S.f.a=this.value.replace(/\\D/g,'');this.value=S.f.a">`)+F('Ulangi PIN',`<input type="password" inputmode="numeric" maxlength="4" oninput="S.f.b=this.value.replace(/\\D/g,'');this.value=S.f.b">`)+'<div class="mut">PIN hanya tersimpan di perangkat ini. Kalau lupa, hapus data situs lalu sambungkan ulang.</div>'+btns('pinSave()')));
}
async function pinSave(){
 const f=S.f;
 if(!/^\d{4}$/.test(f.a))return toast('PIN harus 4 angka',0);
 if(f.a!=f.b)return toast('PIN tidak sama',0);
 ls.set('pin',await sha(f.a));closeS();toast('PIN aktif');render();
}
async function pinOff(){if(await ask('Matikan PIN?','Aplikasi tidak akan meminta PIN lagi di perangkat ini.','Matikan')){localStorage.removeItem('pin');toast('PIN dimatikan');render()}}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(pinOn()&&hiddenAt&&Date.now()-hiddenAt>60000)showLock()});

/* ===== Pengaturan, cadangan, ekspor ===== */
function saveSet(o){op('saveSettings',[o]);toast('Pengaturan tersimpan')}
async function cadangan(){
 busy(1);
 try{const n=await call('cadanganSekarang');toast('Salinan tersimpan di Drive: '+n)}catch(e){toast(e.net?'Butuh internet':e.message,0)}
 busy(0);
}
function backupData(){return {tx:D.tx.map(t=>({id:t.id,type:t.type,date:t.date,akun:t.akun,kat:t.kat,sub:t.sub,nilai:t.nilai,cat:t.cat,tag:t.tag})),trf:D.trf,akun:D.akun,kat:D.kat,ang:D.ang,rep:D.rep,bm:D.bm,memo:D.memo,goal:D.goal,hut:D.hut,set:D.set}}
async function shareFile(f,okMsg){
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:f.name});return}}catch(e){if(e.name=='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast(okMsg);
}
function exportBackup(){return shareFile(new File([JSON.stringify({app:'pengelola-keuangan',dibuat:new Date().toISOString(),data:backupData()})],'pengelola-keuangan-'+TODAY()+'.json',{type:'application/json'}),'Cadangan diunduh. Simpan ke Google Drive dari folder Unduhan.')}
async function pickRestore(el){
 const f=el.files[0];el.value='';if(!f)return;
 let b;try{b=JSON.parse(await f.text())}catch(e){return toast('File bukan cadangan yang valid',0)}
 const d=b.data||b;if(!d||!Array.isArray(d.tx))return toast('File bukan cadangan Pengelola Keuangan',0);
 if(!await ask('Pulihkan dari cadangan?','Berisi '+d.tx.length+' transaksi. Transaksi yang belum ada di spreadsheet akan ditambahkan. Akun, kategori, target, hutang, anggaran, dan pengaturan diganti sesuai cadangan.','Ya, pulihkan'))return;
 busy(1);
 try{await flush();await call('restore',d);const nd=await call('load');ls.set('cache',nd);setD(nd);render();toast('Pemulihan selesai')}catch(e){toast(e.net?'Butuh internet':e.message,0)}
 busy(0);
}
const csvq=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
function exportCsv(periodOnly){
 const r=periodOnly?(S.sub=='bulanan'?yrange(S.y):mrange(S.y,S.m)):null;
 const L=entries().filter(e=>!r||inR(e,r)).slice().reverse();
 const rows=[['Tanggal','Jenis','Akun','Ke akun','Kategori','Sub-kategori','Nilai','Catatan','Tag'],...L.map(e=>[e.date,e.type=='in'?'Pemasukan':e.type=='out'?'Pengeluaran':'Transfer',e.akun,e.ke,e.kat,e.sub,e.nilai,e.cat,e.tag])];
 return shareFile(new File(['\ufeff'+rows.map(x=>x.map(csvq).join(',')).join('\n')],'transaksi-'+TODAY()+'.csv',{type:'text/csv'}),'CSV diunduh');
}

/* ===== Sambungan ===== */
function setupScreen(err){
 closeS();const c=cfg()||{};
 $('#app').innerHTML=bar('Sambungkan')+`<div class="card"><h3>Sambungkan ke spreadsheet</h3><div class="mut">Isi alamat Web App dari Apps Script (berakhiran /exec) dan kunci rahasia yang kamu tulis di Code.gs.</div>${F('Alamat Web App',`<input id="cu" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(c.url||'')}">`)}${F('Kunci rahasia',`<input id="ck" type="password" autocomplete="off" value="${esc(c.key||'')}">`)}${err?`<div class="bad-msg">${esc(err)}</div>`:''}<div class="col"><button type="button" class="btn" onclick="saveCfg()">Sambungkan</button>${D?'<button type="button" class="btn g" onclick="render()">Batal</button>':''}</div></div>`;
}
async function saveCfg(){
 const u=$('#cu').value.trim(),k=$('#ck').value.trim(),old=cfg();
 if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)||!k)return setupScreen('Alamat harus berakhiran /exec dan kunci wajib diisi');
 ls.set('cfg',{url:u,key:k});busy(1);
 try{const d=await call('load');ls.set('cache',d);setD(d);render()}
 catch(e){old?ls.set('cfg',old):localStorage.removeItem('cfg');setupScreen(e.message)}
 busy(0);
}

/* ===== Mulai ===== */
function boot(){
 $('#nav').innerHTML='<div class="navin">'+[['trans','🧾','Transaksi'],['stats','📊','Statistik'],['akun','👛','Akun'],['more','☰','Lainnya']].map(([t,i,l])=>`<button type="button" data-t="${t}" onclick="go('${t}')"><b>${i}</b>${l}</button>`).join('')+'</div>';
 window.addEventListener('online',()=>flush());
 let ly=0;window.addEventListener('scroll',()=>{const y=window.scrollY||0,f=$('#fab');if(!f)return;if(y>ly+8&&y>80)f.classList.add('hide');else if(y<ly-8||y<40)f.classList.remove('hide');ly=y},{passive:true});
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 (async()=>{
  if(pinOn())showLock();
  if(!cfg()){setupScreen();return}
  const c=ls.get('cache',null);
  if(c){setD(c);render()}else render();
  busy(!c);
  try{await flush()}catch(e){}
  if(!D){$('#app').innerHTML=bar('Gagal')+empty('Gagal memuat data','Periksa sambungan internet dan pengaturan Web App.')+'<div class="col pad"><button type="button" class="btn" onclick="location.reload()">Coba lagi</button><button type="button" class="btn g" onclick="setupScreen()">Ubah sambungan</button></div>'}
  busy(0);
 })();
}

boot();
</script>
</body></html>
